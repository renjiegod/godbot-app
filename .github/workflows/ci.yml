name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # godbot/ is a copy of files from dsh-godbot at the commit SOURCE.json records.
      # A pull request may carry a copy of uncommitted changes while it is worked on;
      # main may not, since every APK built from main can become a release.
      - name: Check the synced Godbot files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          dirty=$(node -p "require('./godbot/SOURCE.json').godbot.dirty === true")
          commit=$(node -p "require('./godbot/SOURCE.json').godbot.commit")
          if [ "$dirty" = "true" ]; then
            if [ "$EVENT" = "pull_request" ]; then
              echo "::warning::godbot/ was synced from uncommitted dsh-godbot changes; run npm run sync:godbot from a committed checkout before merging"
              exit 0
            fi
            echo "::error::godbot/ was synced from uncommitted dsh-godbot changes; run npm run sync:godbot from a committed checkout"
            exit 1
          fi
          git clone --quiet --filter=blob:none https://github.com/renjiegod/dsh-godbot.git "$RUNNER_TEMP/dsh-godbot"
          git -C "$RUNNER_TEMP/dsh-godbot" checkout --quiet --detach "$commit"
          GODBOT_SRC="$RUNNER_TEMP/dsh-godbot" npm run check:godbot

  android:
    name: Android release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Restores what Gradle downloads (Gradle itself, the dependencies, their transforms)
      # from a cache keyed on every *.gradle file, those of the native modules npm ci just
      # installed included, so changing a dependency starts a new cache. Gradle's build
      # cache stays off: every APK is still compiled from source.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npx expo prebuild --platform android --no-install
      # Builds of main are signed with the release key and must have it: a debug-signed
      # APK can never update installed copies. Pull requests get no secrets; their APK
      # is debug-signed and uploaded under a name that says so.
      - name: Release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.GODBOT_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GODBOT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GODBOT_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GODBOT_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::The release signing secrets are missing; refusing to build a release APK with the debug key"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/godbot-release.jks"
          {
            echo "GODBOT_ANDROID_KEYSTORE=$RUNNER_TEMP/godbot-release.jks"
            echo "GODBOT_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "GODBOT_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "GODBOT_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build the release APK
        working-directory: android
        # Then stop Gradle's daemon: it goes on writing to ~/.gradle after the build, and the
        # cache setup-java saves at the end of the job fails if it changes while being read.
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
          ./gradlew --stop
      - name: Check the APK is signed with the release certificate
        if: github.event_name != 'pull_request'
        run: node scripts/release-apk.mjs check-signature android/app/build/outputs/apk/release/app-release.apk
      - name: Checksum
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/godbot-$version.apk"
          (cd dist && sha256sum "godbot-$version.apk" > "godbot-$version.apk.sha256")
          # The relay serves this copy with Content-Encoding: gzip to clients that accept it.
          gzip -9 -k -n "dist/godbot-$version.apk"
      # A CI build, not a release: releases come from release.yml, built once and promoted.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'godbot-android-debug-signed' || 'godbot-android' }}
          path: dist/
          retention-days: 14
