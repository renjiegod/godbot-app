plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.renjiegod.godbot'
version = '0.1.0'

android {
  namespace "expo.modules.godbotnative"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // HeadlessJsTaskService (KeepAliveTaskService); the app brings React Native itself.
  compileOnly "com.facebook.react:react-android"
}
